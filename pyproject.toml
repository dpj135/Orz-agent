[project]
name = "mini-agent"
version = "0.1.0"
description = "A small single-agent CLI with an OpenAI-compatible work loop"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pre-commit==4.3.0",
    "pre-commit-hooks==6.0.0",
    "ruff==0.14.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["mini_agent*"]

[project.scripts]
agent = "mini_agent.cli:main"
